<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EFE3" />
    <!-- Il fondo dello splash, PRIMA che arrivino JS e CSS: senza, tra il
         caricamento della pagina e il primo fotogramma del video c'è un lampo
         bianco. Dopo, index.css riporta il body su --paper (#F4EEE2): una
         unità per canale di differenza, invisibile. -->
    <style>html, body { background-color: #F3EFE3; }</style>
    
    <title>Politask - Task Locali a Genova</title>
    <meta name="description" content="Politask - La piattaforma per task locali a Genova. Trova ripetizioni, consegne, staff eventi e molto altro." />
    <meta name="author" content="Politask" />

    <!-- Open Graph -->
    <meta property="og:title" content="Politask - Task Locali a Genova" />
    <meta property="og:description" content="La piattaforma map-first per connettere studenti con task occasionali a Genova." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Politask" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Outfit (Regular 400, Medium 500, Bold 700) — font del TESTO.
         ⚠️ Provato Gabarito al suo posto (agosto 2026) e riportato indietro:
         aveva vinto il confronto a quattro in brand/confronto-font.html come
         font da DISPLAY, ma sul testo minuto e' meno neutro. Shinjo resta sui
         titoli grandi, Outfit su tutto il resto. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Politask">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
